name: Deploy Infrastruttura a Moduli Piatta

on:
  push:
    paths:
      - '*.tf'
      - '*.tfvars'
      - 'modules/**'
  workflow_dispatch:

jobs:
  # JOB 1: Esegue il Plan e salva il risultato
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.0

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        run: terraform plan -out=tfplan

      - name: Salva Artefatto Plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-artifact
          path: tfplan

  # JOB 2: Attende la tua approvazione ed esegue l'Apply
  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: terraform-plan        # Parte solo se il Plan ha avuto successo
    environment: produzione      # <-- Attiva il blocco sul tuo environment "produzione"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.0

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1

      - name: Terraform Init
        run: terraform init

      - name: Scarica Artefatto Plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan-artifact

      - name: Terraform Apply
        run: terraform apply tfplan
