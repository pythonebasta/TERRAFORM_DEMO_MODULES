name: Deploy Infrastruttura a Moduli Piatta

on:
  push:
    paths:
      - '*.tf'
      - '*.tfvars'
      - 'modules/**'
  workflow_dispatch:

jobs:
  # JOB 1: Esegue il Plan, lo converte in JSON e salva i risultati
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.0
          terraform_wrapper: false # Importante: evita che il wrapper sporchi l'output JSON

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        run: terraform plan -out=tfplan

      # Converte il piano binario in JSON per farlo leggere a Checkov
      - name: Converti Plan in JSON
        run: terraform show -json tfplan > tfplan.json

      - name: Salva Artefatti Plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-artifact
          path: |
            tfplan
            tfplan.json

  # JOB 2: Controllo di sicurezza con Checkov (via pip, veloce e senza blocchi)
  checkov-security:
    name: Checkov Security Scan
    runs-on: ubuntu-latest
    needs: terraform-plan # Parte solo dopo il Plan

    steps:
      - name: Scarica Artefatti Plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan-artifact

      - name: Installa ed esegui Checkov sul Terraform Plan
        run: |
          pip install checkov
          checkov -f tfplan.json --framework terraform_plan --output cli

  # JOB 3: Attende la tua approvazione ed esegue l'Apply
  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    # ORA DIPENDE DA ENTRAMBI: non arriverà mai all'approvazione se Checkov fallisce
    needs: [terraform-plan, checkov-security] 
    environment: produzione

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.0

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1

      - name: Terraform Init
        run: terraform init

      - name: Scarica Artefatto Plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan-artifact

      - name: Terraform Apply
        run: terraform apply tfplan
